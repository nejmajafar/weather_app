
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080e1d">
    <meta name="description" content="Modern väderprognos för svenska städer.">

    <title>{% block title %}Weather Dashboard{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="premium-dark">

    <div class="site-wrapper">

        <nav class="navbar" aria-label="Huvudnavigation">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-icon" aria-hidden="true">☁</span>
                <span>WEATHER<span class="brand-accent">.</span></span>
            </a>

            <div class="nav-links">
                <a href="{{ url_for('home') }}" class="nav-link">
                    Overview
                </a>
                <a href="{{ url_for('forecast', city='Stockholm') }}" class="nav-link">
                    Forecast
                </a>
            </div>

            <span class="nav-badge">LIVE WEATHER</span>
        </nav>

        <main class="dashboard">

            <header class="header">
                <p class="subtitle">YOUR DAILY WEATHER REPORT</p>
                <h1>Weather <span class="gradient-text">Dashboard.</span></h1>
                <p class="description">
                    Väderprognoser för svenska städer.
                    En enkel överblick över vädret idag och de kommande dagarna.
                </p>
            </header>

            {% block content %}{% endblock %}

        </main>

        <footer class="site-footer">
            <span>© Weather Dashboard</span>

            <span>
                Weather data by
                <a href="https://open-meteo.com/"
                   target="_blank"
                   rel="noopener noreferrer">
                    Open-Meteo
                </a>
                · CC BY 4.0
            </span>
        </footer>

    </div>

</body>
</html>
