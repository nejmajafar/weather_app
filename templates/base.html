
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Gemensam titel för alla sidor -->
    <title>{% block title %}Weather Dashboard{% endblock %}</title>

    <!-- Hämtar designen från CSS-filen -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="dashboard">

        <!-- Gemensam rubrik -->
        <header class="header">
            <p class="subtitle">WEATHER OVERVIEW</p>
            <h1>Weather Dashboard</h1>
            <p class="description">Väderprognos för svenska städer</p>
        </header>

        <!-- Här visas innehållet från andra HTML-mallar -->
        {% block content %}{% endblock %}

    </main>
</body>
</html>
